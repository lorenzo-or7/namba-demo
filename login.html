<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Entrar | Equipe Namba</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script>try{var t=localStorage.getItem('namba-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body data-admin="login">
<main class="login-shell">
  <div class="login-card">
    <span class="fig fig-bench" aria-hidden="true" style="width:100%;max-width:340px"></span>
    <a href="../index.html" style="text-decoration:none"><span class="logotype"><span class="r">cine</span><span class="k">camera</span><span class="r">service</span></span></a>
    <div>
      <h1>Área da equipe</h1>
      <p class="lead">Acesso restrito à equipe Namba para cadastrar e atualizar ordens de serviço.</p>
    </div>
    <form class="panel" id="loginForm" novalidate style="display:grid;gap:18px">
      <div id="loginMsg"></div>
      <div class="field"><label for="usuario">Usuário</label><input id="usuario" name="usuario" autocomplete="username"></div>
      <div class="field"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password"></div>
      <button class="btn btn-red btn-block" type="submit">Entrar</button>
    </form>
    <div class="proto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>
      <div><strong>Acesso de demonstração:</strong> usuário <code id="demoUser">demo</code> e senha <code id="demoPass">namba2026</code>. Clique para preencher.</div>
    </div>
    <a href="../index.html" class="btn-ghost" style="font-size:14px;color:var(--graphite)">Voltar ao site</a>
  </div>
</main>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/demo-db.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
(function () {
  var DB = window.NambaDB, f = document.getElementById('loginForm'), msg = document.getElementById('loginMsg');
  if (DB.currentAdmin()) { location.replace('index.html'); return; }
  function fill() { f.usuario.value = 'demo'; f.senha.value = 'namba2026'; f.querySelector('button').focus(); }
  document.getElementById('demoUser').addEventListener('click', fill);
  document.getElementById('demoPass').addEventListener('click', fill);
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var u = f.usuario.value.trim(), s = f.senha.value;
    if (!u || !s) { msg.innerHTML = '<div class="alert alert-error" role="alert">Informe usuário e senha.</div>'; return; }
    // Mensagem genérica: não revela se o usuário existe.
    if (!DB.login(u, s)) { msg.innerHTML = '<div class="alert alert-error" role="alert">Usuário ou senha inválidos.</div>'; f.senha.value = ''; f.senha.focus(); return; }
    location.href = 'index.html';
  });
})();
</script>
</body>
</html>
