<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Nova O.S. | Equipe Namba</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script>try{var t=localStorage.getItem('namba-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body data-admin="nova" data-no-wa>
<div id="admin-bar"></div>
<main class="wrap admin-main">
  <div id="admin-proto"></div>
  <div class="admin-title">
    <div><h1>Nova ordem de serviço</h1><p>O número será <strong id="nextNum"></strong>. Se o CPF ou telefone já existir, o cadastro do cliente é reaproveitado.</p></div>
    <a class="btn btn-ghost" href="index.html">Voltar à lista</a>
  </div>
  <div id="errors" class="flash"></div>

  <form id="osForm" novalidate class="two-col even">
    <section class="panel">
      <h2>Cliente</h2>
      <div style="display:grid;gap:18px">
        <div class="field"><label for="nome">Nome completo</label><input id="nome" name="nome" autocomplete="off"></div>
        <div class="form-grid">
          <div class="field"><label for="cpf">CPF</label><input id="cpf" name="cpf" inputmode="numeric" data-mask="cpf" placeholder="000.000.000-00"></div>
          <div class="field"><label for="telefone">Telefone</label><input id="telefone" name="telefone" inputmode="tel" data-mask="phone"></div>
        </div>
        <span class="hint" id="clientHint" style="font-size:13.5px;color:var(--graphite)">Informe ao menos o CPF ou o telefone. É com eles que o cliente acompanha a O.S. no site.</span>
        <div class="field"><label for="email">E-mail <span style="font-weight:400;color:var(--graphite)">(opcional)</span></label><input id="email" name="email" type="email"></div>
      </div>
    </section>

    <section class="panel">
      <h2>Equipamento</h2>
      <div style="display:grid;gap:18px">
        <div class="form-grid">
          <div class="field"><label for="equipamento">Equipamento</label><input id="equipamento" name="equipamento" placeholder="Ex.: Câmera EOS R6"></div>
          <div class="field"><label for="numero_serie">Número de série <span style="font-weight:400;color:var(--graphite)">(opcional)</span></label><input id="numero_serie" name="numero_serie"></div>
        </div>
        <div class="field"><label for="tipo">Tipo de equipamento</label><select id="tipo" name="tipo"><option value="">Selecione</option><option>Câmera EOS</option><option>Objetiva</option><option>Flash</option><option>Câmera compacta</option><option>Outro</option></select><span class="hint">Aparece para o cliente na consulta da O.S.</span></div>
        <div class="field"><label for="defeito_relatado">Defeito relatado pelo cliente</label><textarea id="defeito_relatado" name="defeito_relatado" rows="4"></textarea></div>
        <div class="form-grid">
          <div class="field"><label for="data_entrada">Data de entrada</label><input id="data_entrada" name="data_entrada" type="date"></div>
          <div class="field"><label for="valor_orcamento">Orçamento em R$ <span style="font-weight:400;color:var(--graphite)">(opcional)</span></label><input id="valor_orcamento" name="valor_orcamento" inputmode="decimal" placeholder="Em branco até avaliar"></div>
        </div>
        <button class="btn btn-red" type="submit">Cadastrar O.S.</button>
      </div>
    </section>
  </form>
</main>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/demo-db.js"></script>
<script src="../assets/js/admin.js"></script>
<script src="../assets/js/masks.js"></script>
<script>
(function () {
  if (!window.NambaAdmin) return;
  var DB = window.NambaDB, A = window.NambaAdmin, f = document.getElementById('osForm');
  document.getElementById('nextNum').textContent = DB.gerarNumeroOs();
  f.data_entrada.value = DB.todayIso();

  // Avisa quando o cliente já existe (reaproveitamento pelo CPF/telefone)
  var hint = document.getElementById('clientHint'), hintText = hint.textContent;
  function checkClient() {
    var cpf = DB.onlyDigits(f.cpf.value), tel = DB.onlyDigits(f.telefone.value);
    var c = DB.all().clientes.filter(function (x) { return (cpf.length === 11 && x.cpf === cpf) || (tel.length >= 10 && x.telefone === tel); })[0];
    if (c) {
      hint.innerHTML = 'Cliente já cadastrado: <strong>' + DB.esc(c.nome) + '</strong>. <button type="button" class="restore-btn" id="useClient">Usar os dados dele</button>';
      document.getElementById('useClient').onclick = function () {
        f.nome.value = c.nome; f.cpf.value = c.cpf ? DB.formatCpf(c.cpf) : ''; f.telefone.value = c.telefone ? DB.formatPhone(c.telefone) : ''; f.email.value = c.email || '';
        f.equipamento.focus();
      };
    } else { hint.textContent = hintText; }
  }
  f.cpf.addEventListener('input', checkClient); f.telefone.addEventListener('input', checkClient);

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var r = DB.criarOs(A.formData(f), A.admin.id);
    if (r.erros) { A.showErrors(document.getElementById('errors'), r.erros); return; }
    A.flash('ok', 'O.S. ' + r.os.numero_os + ' cadastrada' + (r.reaproveitado ? ' para um cliente que já existia.' : ' com um novo cliente.'));
    A.goEdit(r.os.id);
  });
})();
</script>
</body>
</html>
