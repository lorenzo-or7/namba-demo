<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Editar O.S. | Equipe Namba</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/img/icon-192.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script>try{var t=localStorage.getItem('namba-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body data-admin="dashboard" data-no-wa>
<div id="admin-bar"></div>
<main class="wrap admin-main">
  <div id="admin-proto"></div>
  <div class="admin-title">
    <div><h1 id="osTitle">O.S.</h1><p id="osSub"></p></div>
    <a class="btn btn-ghost" href="index.html">Voltar à lista</a>
  </div>
  <div id="flash" class="flash"></div>

  <div class="two-col">
    <div style="display:grid;gap:24px">
      <section class="panel">
        <h2>Cliente</h2>
        <dl class="kv" id="clientKv"></dl>
      </section>
      <section class="panel">
        <h2>Defeito relatado</h2>
        <p id="defeito" style="color:var(--graphite)"></p>
      </section>
    </div>

    <section class="panel">
      <h2>Atualizar ordem de serviço</h2>
      <form id="editForm" novalidate>
        <div class="form-grid">
          <div class="field"><label for="equipamento">Equipamento</label><input id="equipamento" name="equipamento"></div>
          <div class="field"><label for="numero_serie">Número de série</label><input id="numero_serie" name="numero_serie"></div>
          <div class="field"><label for="status_atual">Status</label><select id="status_atual" name="status_atual"></select></div>
          <div class="field"><label for="valor_orcamento">Orçamento em R$</label><input id="valor_orcamento" name="valor_orcamento" inputmode="decimal" placeholder="Em branco até avaliar"></div>
        </div>
        <div class="field"><label for="descricao_status">Recado para o cliente <span style="font-weight:400;color:var(--graphite)">(opcional)</span></label><textarea id="descricao_status" name="descricao_status" rows="2" placeholder="Ex.: Peça original a caminho"></textarea><span class="hint">Aparece no histórico que o cliente vê no site.</span></div>
        <div class="field"><label for="observacoes_internas">Observações internas</label><textarea id="observacoes_internas" name="observacoes_internas" rows="3"></textarea><span class="hint">Só a equipe vê. Nunca aparece na consulta pública.</span></div>
        <div class="actions"><button class="btn btn-red" type="submit">Salvar alterações</button><span class="hint" id="saveHint" style="font-size:13.5px;color:var(--graphite)"></span></div>
      </form>
    </section>
  </div>

  <section>
    <h2 style="font-size:22px;margin-bottom:14px">Histórico</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Data e hora</th><th>Status</th><th>Recado ao cliente</th><th>Alterado por</th></tr></thead>
        <tbody id="hist"></tbody>
      </table>
    </div>
  </section>
</main>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/demo-db.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
(function () {
  if (!window.NambaAdmin) return;
  var DB = window.NambaDB, A = window.NambaAdmin, esc = DB.esc;
  var id = A.idFromUrl(), o = DB.ordem(id);
  if (!o) { A.flash('err', 'Essa ordem de serviço não existe mais. Escolha outra na lista.'); location.replace('index.html'); return; }
  var f = document.getElementById('editForm');
  Object.keys(DB.STATUS).forEach(function (k) { f.status_atual.insertAdjacentHTML('beforeend', '<option value="' + k + '">' + DB.STATUS[k] + '</option>'); });
  A.showFlash(document.getElementById('flash'));

  function fill() {
    o = DB.ordem(id);
    var c = DB.cliente(o.cliente_id);
    document.title = 'O.S. ' + o.numero_os + ' | Equipe Namba';
    document.getElementById('osTitle').innerHTML = 'O.S. ' + esc(o.numero_os) + ' <span class="badge ' + DB.statusClass(o.status_atual) + '" style="font-size:14px;vertical-align:middle;margin-left:8px">' + esc(DB.statusLabel(o.status_atual)) + '</span>';
    document.getElementById('osSub').textContent = 'Entrada em ' + DB.formatDateBr(o.data_entrada) + '. Última atualização em ' + DB.formatDateTimeBr(o.atualizado_em) + '.';
    document.getElementById('clientKv').innerHTML =
      '<div><dt>Nome</dt><dd>' + esc(c.nome) + '</dd></div>' +
      '<div><dt>CPF</dt><dd>' + esc(c.cpf ? DB.formatCpf(c.cpf) : '—') + (c.cpf ? '<span class="muted">O cliente vê ' + DB.maskCpf(c.cpf) + ' na consulta.</span>' : '') + '</dd></div>' +
      '<div><dt>Telefone</dt><dd>' + esc(c.telefone ? DB.formatPhone(c.telefone) : '—') + '</dd></div>' +
      '<div><dt>E-mail</dt><dd>' + esc(c.email || '—') + '</dd></div>';
    document.getElementById('defeito').textContent = o.defeito_relatado;
    f.equipamento.value = o.equipamento; f.numero_serie.value = o.numero_serie || '';
    f.status_atual.value = o.status_atual;
    f.valor_orcamento.value = o.valor_orcamento == null ? '' : String(o.valor_orcamento).replace('.', ',');
    f.observacoes_internas.value = o.observacoes_internas || ''; f.descricao_status.value = '';
    document.getElementById('hist').innerHTML = DB.historicoDe(o.id, true).map(function (h) {
      return '<tr><td class="nowrap">' + DB.formatDateTimeBr(h.data_hora) + '</td><td><span class="badge ' + DB.statusClass(h.status) + '">' + esc(DB.statusLabel(h.status)) + '</span></td><td>' + esc(h.descricao || '—') + '</td><td>' + esc(DB.adminNome(h.alterado_por) || '—') + '</td></tr>';
    }).join('') || '<tr><td colspan="4"><div class="empty">Sem histórico ainda.</div></td></tr>';
    hintUpdate();
  }
  function hintUpdate() {
    var mudou = f.status_atual.value !== o.status_atual || f.descricao_status.value.trim();
    document.getElementById('saveHint').textContent = mudou ? 'Ao salvar, uma nova linha entra no histórico.' : '';
  }
  f.status_atual.addEventListener('change', hintUpdate);
  f.descricao_status.addEventListener('input', hintUpdate);

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var r = DB.atualizarOs(id, A.formData(f), A.admin.id);
    var box = document.getElementById('flash');
    if (r.erros) { A.showErrors(box, r.erros); return; }
    box.innerHTML = '<div class="alert alert-ok" role="status">Alterações salvas' + (r.historicoGravado ? ' e registradas no histórico.' : '.') + '</div>';
    fill(); window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  fill();
})();
</script>
</body>
</html>
