<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Clientes | Equipe Namba</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script>try{var t=localStorage.getItem('namba-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body data-admin="clientes" data-no-wa>
<div id="admin-bar"></div>
<main class="wrap admin-main">
  <div id="admin-proto"></div>
  <div class="admin-title">
    <div><h1>Clientes</h1><p>Clientes também são criados automaticamente ao cadastrar uma nova O.S.</p></div>
  </div>
  <div id="flash" class="flash"></div>

  <div class="two-col">
    <section class="panel">
      <h2>Cadastrar cliente</h2>
      <form id="cliForm" novalidate>
        <div class="field"><label for="nome">Nome completo</label><input id="nome" name="nome"></div>
        <div class="field"><label for="cpf">CPF</label><input id="cpf" name="cpf" inputmode="numeric" data-mask="cpf" placeholder="000.000.000-00"></div>
        <div class="field"><label for="telefone">Telefone</label><input id="telefone" name="telefone" inputmode="tel" data-mask="phone"></div>
        <div class="field"><label for="email">E-mail <span style="font-weight:400;color:var(--graphite)">(opcional)</span></label><input id="email" name="email" type="email"></div>
        <button class="btn btn-red" type="submit">Cadastrar cliente</button>
      </form>
    </section>

    <section style="display:grid;gap:14px;min-width:0">
      <div class="filters">
        <label class="sr-only" for="busca">Buscar clientes</label>
        <input class="input" id="busca" type="search" placeholder="Buscar por nome, CPF ou telefone">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>E-mail</th><th>O.S.</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/demo-db.js"></script>
<script src="../assets/js/admin.js"></script>
<script src="../assets/js/masks.js"></script>
<script>
(function () {
  if (!window.NambaAdmin) return;
  var DB = window.NambaDB, A = window.NambaAdmin, esc = DB.esc;
  var f = document.getElementById('cliForm'), busca = document.getElementById('busca');
  function render() {
    var rows = DB.listarClientes(busca.value.trim());
    document.getElementById('rows').innerHTML = rows.length ? rows.map(function (c) {
      return '<tr><td>' + esc(c.nome) + '</td><td class="nowrap">' + esc(c.cpf ? DB.formatCpf(c.cpf) : '—') + '</td><td class="nowrap">' + esc(c.telefone ? DB.formatPhone(c.telefone) : '—') + '</td><td>' + esc(c.email || '—') + '</td><td class="num">' + c.total_os + '</td></tr>';
    }).join('') : '<tr><td colspan="5"><div class="empty">Nenhum cliente encontrado com essa busca.</div></td></tr>';
  }
  busca.addEventListener('input', render);
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var r = DB.criarCliente(A.formData(f)), box = document.getElementById('flash');
    if (r.erros) { A.showErrors(box, r.erros); return; }
    box.innerHTML = '<div class="alert alert-ok" role="status">' + esc(r.cliente.nome) + ' cadastrado.</div>';
    f.reset(); busca.value = ''; render();
  });
  render();
})();
</script>
</body>
</html>
